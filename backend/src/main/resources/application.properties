spring.application.name=fashion-store-backend
spring.profiles.default=local

server.port=${SERVER_PORT:8080}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.config.jwt-signer-key=${APP_CONFIG_JWT_SIGNER_KEY}
app.config.jwt-valid-duration=${APP_CONFIG_JWT_VALID_DURATION:86400}
app.config.jwt-refreshable-duration=${APP_CONFIG_JWT_REFRESHABLE_DURATION:604800}
