spring.application.name=fashion-store-backend

server.port=${SERVER_PORT:8080}

# Cấu hình datasource (mặc định kết nối database Fashion_Central)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=Fashion_Central;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
# Mật khẩu database được che giấu (cấu hình qua biến môi trường SPRING_DATASOURCE_PASSWORD hoặc file application-local.properties)
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Sử dụng schema hiện có trong database, không tự tạo bảng
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# CORS cho phép frontend kết nối (mặc định Vite chạy cổng 5173)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Cấu hình JWT: Khóa bí mật (HS512 tối thiểu 64 bytes) được che giấu (cấu hình qua JWT_SIGNER_KEY hoặc application-local.properties)
jwt.signerKey=${JWT_SIGNER_KEY:${APP_CONFIG_JWT_SIGNER_KEY:}}
jwt.valid-duration=${JWT_VALID_DURATION:3600}
jwt.refreshable-duration=${JWT_REFRESHABLE_DURATION:604800}

# Ánh xạ thuộc tính tương thích ngược cho JWT
app.config.jwt-signer-key=${jwt.signerKey}
app.config.jwt-valid-duration=${jwt.valid-duration}
app.config.jwt-refreshable-duration=${jwt.refreshable-duration}

# Tự động tạo và đồng bộ tài khoản có sẵn khi chạy local (admin, manager, staff) với mật khẩu 123456
app.bootstrap-accounts.enabled=${APP_BOOTSTRAP_ACCOUNTS_ENABLED:true}
app.bootstrap-accounts.password=${APP_BOOTSTRAP_ACCOUNTS_PASSWORD:123456}
