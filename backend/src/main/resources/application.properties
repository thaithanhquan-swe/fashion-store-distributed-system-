spring.application.name=fashion-store-backend

server.port=8080

# Cấu hình datasource kết nối SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=Fashion_Central;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
# Mật khẩu database tài khoản sa (che giấu để bảo mật - điền mật khẩu máy bạn hoặc dùng biến môi trường SPRING_DATASOURCE_PASSWORD)
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Sử dụng schema có sẵn trong database, không tự tạo bảng
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# CORS cho phép frontend kết nối (Vite mặc định cổng 5173)
app.cors.allowed-origins=http://localhost:5173

# Cấu hình JWT: Khóa bí mật (HS512 tối thiểu 64 bytes) được che giấu để bảo mật (điền khóa bí mật hoặc dùng biến môi trường JWT_SIGNER_KEY)
jwt.signerKey=${JWT_SIGNER_KEY:${APP_CONFIG_JWT_SIGNER_KEY:}}
jwt.valid-duration=3600
jwt.refreshable-duration=604800

# Ánh xạ thuộc tính tương thích ngược cho JWT
app.config.jwt-signer-key=${jwt.signerKey}
app.config.jwt-valid-duration=${jwt.valid-duration}
app.config.jwt-refreshable-duration=${jwt.refreshable-duration}

# Tự động tạo và đồng bộ tài khoản có sẵn khi khởi động (admin, manager, staff với mật khẩu 123456)
app.bootstrap-accounts.enabled=true
app.bootstrap-accounts.password=123456
