spring.application.name=${SPRING_APPLICATION_NAME:fashion-store-backend}
spring.profiles.default=local

server.port=${SERVER_PORT:8080}

# Cấu hình mẫu cho datasource; đặt SPRING_DATASOURCE_PASSWORD trong môi trường.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=Fashion_Q1;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.microsoft.sqlserver.jdbc.SQLServerDriver}

# Thiết lập JPA mẫu, giữ schema hiện có và không tự tạo bảng.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.hibernate.naming.physical-strategy=${SPRING_JPA_NAMING_STRATEGY:org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.config.jwt-signer-key=${APP_CONFIG_JWT_SIGNER_KEY}
app.config.jwt-valid-duration=${APP_CONFIG_JWT_VALID_DURATION:86400}
app.config.jwt-refreshable-duration=${APP_CONFIG_JWT_REFRESHABLE_DURATION:604800}

# Ba thuộc tính JWT tương ứng với application-local.properties.
jwt.signerKey=${app.config.jwt-signer-key}
jwt.valid-duration=${app.config.jwt-valid-duration}
jwt.refreshable-duration=${app.config.jwt-refreshable-duration}

# Demo accounts are bootstrapped only by the local-profile runner.
app.bootstrap-accounts.enabled=${APP_BOOTSTRAP_ACCOUNTS_ENABLED:true}
app.bootstrap-accounts.password=${APP_BOOTSTRAP_ACCOUNTS_PASSWORD:123456}
